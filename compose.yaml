# Disposable development stack. Synthetic data only. Not a deployment.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: charter
      POSTGRES_PASSWORD: charter-dev-only
      POSTGRES_DB: charter
    ports:
      - "127.0.0.1:55432:5432"   # loopback only
    tmpfs:
      - /var/lib/postgresql/data   # nothing persists; teardown is `down -v`
